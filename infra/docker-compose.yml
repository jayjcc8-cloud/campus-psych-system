services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teacher_support
      POSTGRES_USER: teacher_support
      POSTGRES_PASSWORD: teacher_support
    ports:
      - "5432:5432"
    volumes:
      - teacher-support-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher_support -d teacher_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm dev:api"
    environment:
      DATABASE_URL: postgresql://teacher_support:teacher_support@postgres:5432/teacher_support
      ADMIN_PASSWORD: Admin@123456
      HASH_SECRET: change-me-in-production
      ADMIN_TOKEN_SECRET: change-me-in-production
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ..:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm dev:admin"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:4000
    ports:
      - "5173:5173"
    volumes:
      - ..:/workspace
    depends_on:
      - api

volumes:
  teacher-support-postgres:
